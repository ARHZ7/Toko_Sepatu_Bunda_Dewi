<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Abby Collection</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- CSS Terpisah -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-card">
    <div class="brand-header">
      <h1 class="brand-title">Abby Collection</h1>
      <p class="brand-subtitle">Silakan masuk ke akun Anda</p>
    </div>

    <form id="loginForm">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nama@email.com" required>
      </div>

      <div class="input-group">
        <label for="password">Kata Sandi</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="remember-forgot">
        <label class="checkbox-container">
          <input type="checkbox" id="rememberMe">
          <span class="checkmark"></span>
          Ingat Saya
        </label>
        <a href="#" class="forgot-link">Lupa kata sandi?</a>
      </div>

      <button type="submit" class="btn-submit">Masuk</button>
    </form>

    <div class="footer-link">
      Belum punya akun? <a href="#">Daftar sekarang</a>
    </div>
  </div>

  <!-- JavaScript Terpisah -->
  <script src="script.js"></script>
</body>
</html>
